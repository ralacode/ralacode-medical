name: 記事テーマ
description: 用語解説記事のテーマを指示する。定期実行が古い順に 1 日 1 本書いて PR を送る
title: "【記事テーマ】"
labels:
  - article-theme
body:
  - type: input
    id: theme
    attributes:
      label: テーマ
      description: 記事にしたい用語やテーマ
      placeholder: 放射線治療の標的体積
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 学生の疑問
      description: 問題を解いていて学生が迷うこと。記事はこの疑問に答える形で書かれる
      placeholder: |
        「CTV と PTV の違いは？」
        「ITV はどこに入るの？」
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 関連する問題（任意）
      description: 疑問が出る問題の ID。1 行に 1 つ
      placeholder: 2025-77th-pm-041
  - type: textarea
    id: memo
    attributes:
      label: メモ（任意）
      description: 入れてほしい論点、入れなくてよい話など
